id: clean-technical
visual_behavior:
  mode: preset
  preset_id: clean-technical
  description: Precise, restrained engineering language with topology and notation ahead of decoration.
  shape_language: Low-radius geometry with explicit technical symbols and boundaries.
  whitespace_rhythm: Structured spacing with compact primary paths and clear boundary gaps.
  decoration: Semantic titles and emphasis only; no ornamental cards, imagery, or shadows.
  elevation: Flat hierarchy expressed through stroke weight and luminance.
palette:
  background: "#f8fafc"
  surface: "#ffffff"
  primary: "#2563eb"
  accent: "#14b8a6"
  text: "#0f172a"
  muted: "#64748b"
  line: "#94a3b8"
typography:
  font_family: "Source Han Sans CN, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
  diagram_title_size: 28
  group_title_size: 18
  node_title_size: 16
  node_body_size: 14
  edge_label_size: 14
  annotation_size: 13
  min_font_size: 12
geometry:
  node_padding_x: 24
  node_padding_y: 16
  cluster_padding: 28
  node_gap: 40
  rank_gap: 68
  corner_radius: 4
connectors:
  width: 1.6
  arrow_size: 7
  routing: adaptive
stroke_language:
  node_width: 1.4
  boundary_width: 1.2
  connector_width: 1.6
  emphasis_width: 2.4
  linecap: round
  linejoin: round
texture:
  mode: none
  description: Flat solid fields without grain, grid, glow, or paper texture.
