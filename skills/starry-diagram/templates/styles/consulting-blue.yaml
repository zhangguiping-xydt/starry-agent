id: consulting-blue
visual_behavior:
  mode: preset
  preset_id: consulting-blue
  description: Analytical technical-report language with strong alignment and restrained hierarchy.
  shape_language: Mostly sharp containers, thin rules, explicit grouping, and minimal corner rounding.
  whitespace_rhythm: Columnar spacing with generous separation between unrelated technical concerns.
  decoration: Dividers and small evidence annotations only; avoid presentation-page furniture.
  elevation: Flat hierarchy with contrast bands instead of shadows.
palette:
  background: "#f4f8ff"
  surface: "#ffffff"
  primary: "#1d4ed8"
  accent: "#0ea5e9"
  text: "#172554"
  muted: "#607086"
  line: "#bfdbfe"
typography:
  font_family: "Source Han Sans CN, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
  diagram_title_size: 28
  group_title_size: 18
  node_title_size: 16
  node_body_size: 14
  edge_label_size: 14
  annotation_size: 13
  min_font_size: 12
geometry:
  node_padding_x: 24
  node_padding_y: 16
  cluster_padding: 28
  node_gap: 40
  rank_gap: 68
  corner_radius: 2
connectors:
  width: 1.5
  arrow_size: 7
  routing: adaptive
stroke_language:
  node_width: 1.2
  boundary_width: 1.0
  connector_width: 1.5
  emphasis_width: 2.2
  linecap: square
  linejoin: miter
texture:
  mode: none
  description: Clean publication field without gradients, grain, or glow.
