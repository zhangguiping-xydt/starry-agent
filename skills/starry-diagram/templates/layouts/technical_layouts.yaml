version: 4
route_economy:
  direct_when_clear: true
  direct_path_clearance_px: 6
  max_clear_detour_ratio:
    primary: 1.12
    secondary: 1.18
    control: 3.0
  max_clear_bends:
    primary: 0
    secondary: 0
    control: 4
  max_total_detour_ratio:
    primary: 2.0
    secondary: 2.5
    control: 3.0
  max_total_bends:
    primary: 2
    secondary: 3
    control: 4
patterns:
  layered-system:
    summary: Stack technical layers or runtime tiers with dependencies flowing in one direction.
    supports: [architecture, component, deployment, concept]
    directions: [top-to-bottom, left-to-right]
    pick_when:
      - Three to six explicit tiers or layers organize most nodes and dependencies flow predominantly in one direction.
    skip_when:
      - Peer-to-peer dependencies, ownership boundaries, or physical zones dominate the structure.
    alternatives:
      - Use dependency-map for peer dependencies, bounded-context-map for ownership, or deployment-zones for physical nesting.
    section_limits: {nodes: 20, edges: 28, groups: 6}
    max_total_items: 50
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Allocate layer and boundary rectangles before placing nodes.
      - Route dependencies through layer gaps instead of through peer nodes.
      - Keep the dominant dependency direction consistent across the canvas.
  bounded-context-map:
    summary: Show domain or runtime boundaries with a small number of labeled cross-boundary relationships.
    supports: [architecture, business-architecture, component]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Domain, ownership, trust, or runtime boundaries are explicit and cross-boundary relationships are limited.
    skip_when:
      - Cross-boundary links dominate internal structure or no source-grounded boundaries exist.
    alternatives:
      - Use layered-system for tiers or dependency-map for connector-centric structure.
    section_limits: {nodes: 18, edges: 22, groups: 8}
    max_total_items: 48
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Make boundaries primary and internal nodes secondary.
      - Use explicit ports or boundary gaps for cross-boundary edges.
      - Split when cross-boundary relationships dominate internal structure.
  dependency-map:
    summary: Show components or packages and their directed dependency graph.
    supports: [architecture, component]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Directed module or component dependencies are primary and can be ranked by dependency depth.
    skip_when:
      - Containment, chronological messages, or business stages are the primary reading task.
    alternatives:
      - Use layered-system for tiers, bounded-context-map for ownership, or sequence-lifelines for chronology.
    section_limits: {nodes: 18, edges: 26, groups: 6}
    max_total_items: 48
    quality_limits:
      max_edge_crossings: 1
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Rank nodes by dependency depth before routing edges.
      - Keep cycles visually isolated and explicitly labeled.
      - Do not use a force-directed layout for a directed dependency story.
  deployment-zones:
    summary: Nest environments, zones, hosts, containers, and deployed components.
    supports: [deployment, architecture]
    directions: [top-to-bottom, left-to-right]
    pick_when:
      - Environments, zones, hosts, containers, or trust boundaries form explicit nested placement.
    skip_when:
      - The source only provides logical services without physical or runtime placement.
    alternatives:
      - Use layered-system when runtime tiers matter more than physical nesting.
    section_limits: {nodes: 20, edges: 24, groups: 8}
    max_total_items: 52
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Draw containment before network or runtime connections.
      - Keep environment and trust boundaries visually distinct.
      - Route cross-zone links through the nearest boundary edge.
  capability-map:
    summary: Arrange business capabilities or domains as a balanced hierarchy or matrix.
    supports: [business-architecture, concept]
    directions: [top-to-bottom, matrix]
    pick_when:
      - Capabilities or conceptual domains form an explicit hierarchy or peer matrix with few relationships.
    skip_when:
      - Ordered stages or connector-heavy interactions are the primary story.
    alternatives:
      - Use value-stream for ordered business stages or bounded-context-map for ownership relationships.
    section_limits: {nodes: 24, edges: 12, groups: 8}
    max_total_items: 50
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.9
      min_analyzable_edge_fraction: 0.6
    rules:
      - Prefer containment and alignment over connector-heavy composition.
      - Keep peer capabilities equal in size and spacing.
      - Move value-stream relationships to a separate view when they obscure the map.
  value-stream:
    summary: Show business stages and the capabilities or roles contributing to each stage.
    supports: [business-architecture, flow]
    directions: [left-to-right]
    pick_when:
      - Three to eight ordered value stages are explicit and supporting roles or capabilities map cleanly to stages.
    skip_when:
      - Decisions, retries, or technical message chronology dominate the process.
    alternatives:
      - Use branching-flow for decisions or sequence-lifelines for chronological messages.
    section_limits: {nodes: 16, edges: 18, groups: 6}
    max_total_items: 40
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.9
      min_analyzable_edge_fraction: 0.8
    rules:
      - Reserve one uninterrupted band for the value stream.
      - Place supporting capabilities above or below their stages.
      - Avoid bidirectional arrows on the primary stream.
  linear-flow:
    summary: Show three to eight ordered steps with at most one minor branch.
    supports: [flow]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Three to eight ordered steps form one dominant path with at most one minor branch.
    skip_when:
      - Multiple substantial branches, explicit ownership lanes, or a feedback loop are required.
    alternatives:
      - Use branching-flow for decisions, swimlane-flow for ownership, or loop-mechanism for a small explicit loop.
    section_limits: {nodes: 8, edges: 10, groups: 3}
    max_total_items: 21
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.85
      min_analyzable_edge_fraction: 0.9
    rules:
      - Keep the primary path on one visual axis.
      - Put labels adjacent to short connectors, never on top of nodes.
      - Use branching-flow when decisions create more than one substantial branch.
  branching-flow:
    summary: Show a primary process with decisions, exception branches, and explicit convergence.
    supports: [flow, state]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Decisions, exception paths, retries, and convergence are explicit around one primary path.
    skip_when:
      - The process is linear, ownership lanes are primary, or lifecycle states are the actual subject.
    alternatives:
      - Use linear-flow for one path, swimlane-flow for responsibility, or state-transition for lifecycle topology.
    section_limits: {nodes: 14, edges: 18, groups: 4}
    max_total_items: 36
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.95
      min_analyzable_edge_fraction: 0.9
    rules:
      - Keep the happy path straight and route exceptions away from it.
      - Converge branches before the next major phase when semantics permit.
      - Route loopbacks on an outer rail instead of across the process body.
  control-sidecar-flow:
    summary: Show a primary flow plus a separate state, policy, evidence, or control plane.
    supports: [flow, data-flow, event-flow, concept]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - A primary flow is explicitly constrained by a separate policy, evidence, state, or control plane.
    skip_when:
      - Control concerns are incidental, inferred, or larger than the primary process.
    alternatives:
      - Use branching-flow for inline decisions or split the control plane into a companion diagram.
    section_limits: {nodes: 18, edges: 24, groups: 5}
    max_total_items: 47
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.95
      min_analyzable_edge_fraction: 0.9
    rules:
      - Reserve a side or bottom rail for control-plane nodes before placing the main flow.
      - Connect the control plane through shared buses or ports, not repeated full-canvas diagonals.
      - Split control details into a companion diagram when the sidecar exceeds four nodes or eight links.
  swimlane-flow:
    summary: Show responsibility handoffs across actor, team, or system lanes.
    supports: [swimlane, flow]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Every activity has an explicit owner and handoffs across roles, teams, or systems are central.
    skip_when:
      - Ownership is missing or message chronology is more important than activity ownership.
    alternatives:
      - Use linear-flow or branching-flow when ownership is secondary, and sequence-lifelines for messages.
    section_limits: {nodes: 18, edges: 22, lanes: 6}
    max_total_items: 48
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.9
    rules:
      - Allocate lanes before activities and keep each activity inside its owner lane.
      - Prefer straight handoffs across adjacent lane boundaries.
      - Split phases when repeated long-range handoffs create crossings.
  sequence-lifelines:
    summary: Show ordered messages across stable participant lifelines.
    supports: [sequence]
    directions: [top-to-bottom]
    pick_when:
      - Stable participants exchange explicitly ordered messages and chronology is primary.
    skip_when:
      - The source describes structural dependencies, owner activities, or unordered data movement.
    alternatives:
      - Use dependency-map for structure, swimlane-flow for owned activities, or data-pipeline for transformation.
    section_limits: {participants: 10, messages: 30}
    max_total_items: 40
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 99
      max_long_edge_ratio: 0.9
      min_analyzable_edge_fraction: 0.8
    readability_limits:
      max_participants_without_fragments: 7
      max_messages_without_fragments: 18
      max_messages_per_phase: 12
    rules:
      - Keep participant order stable and messages strictly top-to-bottom.
      - Use activation or grouping bands instead of moving messages out of order.
      - Partition the message stream with contiguous phase fragments when the soft density budget is exceeded.
      - Keep alt/opt/loop/ref fragments for source-grounded control semantics; they do not replace density phases.
      - Split scenarios when phases cannot stay within the readable message budget.
  er-domain-grid:
    summary: Arrange entities by domain with orthogonal relationship routing.
    supports: [er]
    directions: [left-to-right, top-to-bottom, matrix]
    pick_when:
      - Entities have explicit fields, keys, cardinalities, and domain grouping.
    skip_when:
      - Schema facts are incomplete or the reading task is data movement rather than relationships.
    alternatives:
      - Request clarification for missing schema facts or use data-pipeline for movement.
    section_limits: {entities: 12, relationships: 18}
    max_total_items: 30
    quality_limits:
      max_edge_crossings: 1
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Cluster entities by domain or aggregate before routing relationships.
      - Keep cardinalities adjacent to their entity endpoints.
      - Split large schemas by bounded context and add an overview relationship map.
  state-transition:
    summary: Show lifecycle states with a clear initial state, terminal states, and guarded transitions.
    supports: [state]
    directions: [left-to-right, top-to-bottom, radial]
    pick_when:
      - Named lifecycle states, guards, initial state, and terminal behavior form the primary topology.
    skip_when:
      - The source only lists procedural steps or owner handoffs without state semantics.
    alternatives:
      - Use branching-flow for procedure or swimlane-flow for responsibility.
    section_limits: {states: 14, transitions: 20}
    max_total_items: 34
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.95
      min_analyzable_edge_fraction: 0.8
    rules:
      - Put the primary lifecycle on one axis and exceptions outside it.
      - Keep self-transitions and loopbacks on local outer arcs.
      - Split orthogonal state regions into companion diagrams when needed.
  data-pipeline:
    summary: Show collection, transformation, storage, and consumption stages.
    supports: [data-flow]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Collection, transformation, storage, and consumption form an ordered data path.
    skip_when:
      - A central exchange, event reactions, or synchronous participant calls dominate.
    alternatives:
      - Use data-hub for central exchange, event-bus for event reactions, or sequence-lifelines for calls.
    section_limits: {nodes: 14, edges: 18, groups: 5}
    max_total_items: 37
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.9
      min_analyzable_edge_fraction: 0.9
    rules:
      - Keep data movement on the primary axis and transformations inside stages.
      - Separate command or event edges from data edges visually and spatially.
      - Split batch and streaming paths when they cannot share the same route cleanly.
  data-hub:
    summary: Show producers and consumers around a central store, platform, or exchange.
    supports: [data-flow, architecture]
    directions: [radial, left-to-right]
    pick_when:
      - Explicit producers and consumers connect through one central store, platform, or exchange.
    skip_when:
      - Ordered transformation stages or multiple unrelated hubs are required.
    alternatives:
      - Use data-pipeline for ordered transformation or split unrelated hubs into separate views.
    section_limits: {nodes: 16, edges: 22, groups: 5}
    max_total_items: 43
    quality_limits:
      max_edge_crossings: 1
      max_edge_node_intersections: 0
      max_long_edge_ratio: 1.0
      min_analyzable_edge_fraction: 0.8
    rules:
      - Keep the hub visually dominant without turning every edge into a diagonal.
      - Place producers and consumers in separate regions when direction matters.
      - Use edge bundling or ports for repeated connections.
  event-bus:
    summary: Show producers, topics, subscribers, and projections around one or more event rails.
    supports: [event-flow, architecture]
    directions: [left-to-right, top-to-bottom]
    pick_when:
      - Producers, named event rails or topics, subscribers, and projections are explicit.
    skip_when:
      - Payload transformation or synchronous request chronology is primary.
    alternatives:
      - Use data-pipeline for transformations or sequence-lifelines for chronological calls.
    section_limits: {nodes: 16, edges: 24, groups: 6}
    max_total_items: 46
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.95
      min_analyzable_edge_fraction: 0.9
    rules:
      - Draw event rails before producers and subscribers.
      - Keep commands, events, and projections in separate visual channels.
      - Split unrelated event domains rather than adding a second crossing rail.
  loop-mechanism:
    summary: Show a small conceptual feedback loop with explicit state and stopping conditions.
    supports: [concept, flow]
    directions: [radial, left-to-right]
    pick_when:
      - A small explicit feedback loop has named stages, evidence, guardrails, and a stopping condition.
    skip_when:
      - Operational steps exceed the loop budget or the loop would require invented stages.
    alternatives:
      - Use branching-flow for operational detail and keep the loop as a separate conceptual overview.
    section_limits: {nodes: 10, edges: 14, groups: 4}
    max_total_items: 28
    quality_limits:
      max_edge_crossings: 0
      max_edge_node_intersections: 0
      max_long_edge_ratio: 0.9
      min_analyzable_edge_fraction: 0.8
    rules:
      - Limit the visible loop to the stages necessary to explain the mechanism.
      - Put evidence, guardrails, and stop conditions adjacent to the stage they constrain.
      - Use a process detail diagram when operational steps exceed the loop budget.
