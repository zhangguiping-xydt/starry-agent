contract_version: 5
id: architecture-overview
title: 架构总览
type: architecture
viewpoint_family: structure
reading_question: 用户请求经过哪些系统边界和核心组件？
notation_profile: architecture-structure
source_format: graphviz
visual_style:
  enhancement_level: strong
pack_identity:
  id: clean-technical
  visual_behavior:
    mode: preset
    preset_id: clean-technical
    description: 精确、克制的工程图语言，以技术边界和拓扑为主，不使用幻灯片装饰。
    shape_language: 低圆角、清晰边界、按技术符号区分节点，不将所有对象渲染为卡片。
    whitespace_rhythm: 结构化留白，主路径紧凑，边界之间保留明确间隔。
    decoration: 仅保留帮助技术阅读的标题、分组和强调，不使用无语义阴影或插画。
    elevation: 扁平层级，通过描边粗细和明度区分层次。
  palette:
    background: "#f8fafc"
    surface: "#ffffff"
    primary: "#2563eb"
    accent: "#14b8a6"
    text: "#0f172a"
    muted: "#64748b"
    line: "#94a3b8"
  typography:
    font_family: "Source Han Sans CN, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
    diagram_title_size: 28
    group_title_size: 18
    node_title_size: 16
    node_body_size: 14
    edge_label_size: 14
    annotation_size: 13
    min_font_size: 12
  stroke_language:
    node_width: 1.4
    boundary_width: 1.2
    connector_width: 1.6
    emphasis_width: 2.4
    linecap: round
    linejoin: round
  texture:
    mode: none
    description: 纯色平面，不添加纸张、颗粒、网格或光晕纹理。
diagram_treatment:
  renderer_family: architecture
  composition_rhythm: focal
  focal_item: workflow-orchestration-service
  emphasis: 核心组件、系统边界与主调用路径。
  boundary_style: 使用明确的分层容器表达运行时边界。
  connector_style: 无障碍边直连，回环与控制线使用可解释的外轨。
  hierarchy_strategy: 编排服务为视觉焦点，入口与主调用为主层，运行时边界退为上下文层。
  spacing_strategy: 主路径占据画布中心，边界与标题保持可辨留白，不形成孤立内容岛。
  differentiation_strategy: 使用架构容器、组件端口与依赖线，不复用流程或状态节点骨架。
layout_plan:
  pattern: layered-system
  selection_reason: 源材料明确给出应用入口与编排服务的分层依赖，且不存在以消息时序为主的阅读任务。
  direction: left-to-right
  density: balanced
  view_role: standalone
  primary_items:
    - frontend-chat-entry
    - workflow-orchestration-service
  regions: []
  edge_roles:
    primary:
      - frontend-to-workflow
    secondary: []
    control: []
canvas:
  mode: fixed
  width: 1280
  height: 720
  viewBox: "0 0 1280 720"
delivery_target:
  width_px: 1200
  height_px: 675
  fit: contain
  min_effective_font_px: 12
  min_contrast_ratio: 4.5
  min_text_padding_px: 6
  max_edge_label_distance_px: 28
  max_unmeasurable_text_fraction: 0
raster_delivery:
  format: png
  pixel_ratio: 2
nodes:
  - id: frontend-chat-entry
    label: 前端对话入口
    kind: ui
    notation_role: external-system
    required: true
  - id: workflow-orchestration-service
    label: 工作流编排服务
    kind: service
    notation_role: service
    required: true
edges:
  - id: frontend-to-workflow
    from: frontend-chat-entry
    to: workflow-orchestration-service
    label: 提交对话任务
    required: true
groups:
  - id: application-runtime
    label: 应用运行时
    notation_role: boundary
    members:
      - frontend-chat-entry
      - workflow-orchestration-service
style_tokens:
  colors:
    background: "#f8fafc"
    surface: "#ffffff"
    primary: "#2563eb"
    accent: "#14b8a6"
    text: "#0f172a"
    muted: "#64748b"
    line: "#94a3b8"
  typography:
    font_family: "Source Han Sans CN, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
    diagram_title_size: 28
    group_title_size: 18
    node_title_size: 16
    node_body_size: 14
    edge_label_size: 14
    annotation_size: 13
    min_font_size: 12
  geometry:
    node_padding_x: 24
    node_padding_y: 16
    cluster_padding: 28
    node_gap: 40
    rank_gap: 68
    corner_radius: 8
  connectors:
    width: 1.6
    arrow_size: 7
    routing: adaptive
  strokes:
    node_width: 1.4
    boundary_width: 1.2
    connector_width: 1.6
    emphasis_width: 2.4
    linecap: round
    linejoin: round
