id: product-soft
visual_behavior:
  mode: preset
  preset_id: product-soft
  description: Approachable technical language for onboarding and product operations without losing notation fidelity.
  shape_language: Soft containers for ordinary steps while decisions, states, stores, and lifelines keep native shapes.
  whitespace_rhythm: Open spacing, shorter rows, and clearly separated explanatory regions.
  decoration: Gentle grouping and restrained highlights; avoid card grids unrelated to technical structure.
  elevation: Flat-to-subtle hierarchy; shadows are off by default.
palette:
  background: "#fff7ed"
  surface: "#ffffff"
  primary: "#f97316"
  accent: "#22c55e"
  text: "#1f2937"
  muted: "#78716c"
  line: "#fed7aa"
typography:
  font_family: "Source Han Sans CN, Noto Sans CJK SC, Microsoft YaHei, sans-serif"
  diagram_title_size: 28
  group_title_size: 18
  node_title_size: 16
  node_body_size: 14
  edge_label_size: 14
  annotation_size: 13
  min_font_size: 12
geometry:
  node_padding_x: 24
  node_padding_y: 16
  cluster_padding: 28
  node_gap: 40
  rank_gap: 68
  corner_radius: 12
connectors:
  width: 1.8
  arrow_size: 7
  routing: orthogonal
stroke_language:
  node_width: 1.4
  boundary_width: 1.2
  connector_width: 1.8
  emphasis_width: 2.6
  linecap: round
  linejoin: round
texture:
  mode: none
  description: Flat warm field with no paper grain, glow, or decorative pattern.
