version: 3
enhancement_levels:
  light: 1
  medium: 2
  strong: 3
profiles:
  architecture:
    pick_when:
      - Stable components, services, stores, or runtime boundaries are the primary reading task.
      - The source contains structural dependencies or containment that remain meaningful without message order.
    skip_when:
      - Ordered calls, retries, or asynchronous message chronology are the primary story.
      - Physical environments and network placement are more important than logical structure.
    alternatives:
      - Use sequence for ordered interactions and deployment for physical runtime placement.
      - Use component when package-level dependencies are the complete scope.
    preferred_source_formats: [graphviz]
    allowed_source_formats: [graphviz]
    preferred_layout_patterns: [layered-system, bounded-context-map]
    allowed_layout_patterns: [layered-system, bounded-context-map, dependency-map, data-hub, deployment-zones, event-bus]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: structure
    allowed_viewpoint_families: [structure]
    preferred_notation_profiles: [architecture-structure]
    allowed_notation_profiles: [architecture-structure]
  business-architecture:
    pick_when:
      - Business domains, capabilities, ownership, or value stages are explicitly named.
      - The reading task is organizational or capability structure rather than runtime behavior.
    skip_when:
      - The source only describes implementation services or an operational procedure.
      - Capability names or ownership boundaries are inferred rather than stated.
    alternatives:
      - Use architecture for runtime structure and flow for an ordered business procedure.
    preferred_source_formats: [graphviz, mermaid]
    allowed_source_formats: [graphviz, mermaid]
    preferred_layout_patterns: [capability-map, value-stream, bounded-context-map]
    allowed_layout_patterns: [capability-map, value-stream, bounded-context-map]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: structure
    allowed_viewpoint_families: [structure]
    preferred_notation_profiles: [business-capability]
    allowed_notation_profiles: [business-capability]
  component:
    pick_when:
      - Modules, packages, libraries, or deployable components and their dependencies are explicit.
      - The scope is narrower than a system architecture and dependency direction matters.
    skip_when:
      - Runtime tiers, business capabilities, or deployment zones are the primary reading task.
      - The source lacks explicit component boundaries or dependencies.
    alternatives:
      - Use architecture for system-wide structure and deployment for physical placement.
    preferred_source_formats: [graphviz]
    allowed_source_formats: [graphviz]
    preferred_layout_patterns: [dependency-map, layered-system]
    allowed_layout_patterns: [dependency-map, layered-system, bounded-context-map]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: structure
    allowed_viewpoint_families: [structure]
    preferred_notation_profiles: [architecture-structure]
    allowed_notation_profiles: [architecture-structure]
  concept:
    pick_when:
      - The source explicitly defines a mechanism, feedback loop, flywheel, or abstract relationship.
      - Precise technical notation is less important than explaining the named mechanism.
    skip_when:
      - The source provides executable process steps, ordered messages, or lifecycle states.
      - A loop or mechanism would need invented stages to become visually complete.
    alternatives:
      - Use flow for operational steps, sequence for interactions, and state for lifecycle behavior.
    preferred_source_formats: [svg]
    allowed_source_formats: [svg]
    preferred_layout_patterns: [loop-mechanism, capability-map]
    allowed_layout_patterns: [loop-mechanism, capability-map, layered-system, control-sidecar-flow]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: concept
    allowed_viewpoint_families: [concept]
    preferred_notation_profiles: [loop-mechanism]
    allowed_notation_profiles: [loop-mechanism]
  data-flow:
    pick_when:
      - Collection, transformation, persistence, synchronization, or consumption of data is primary.
      - Data direction and processing stages remain meaningful without chronological message order.
    skip_when:
      - Events as facts, commands, or participant chronology are the primary semantics.
      - The source does not identify data movement or transformation.
    alternatives:
      - Use event-flow for publish/subscribe facts and sequence for ordered calls.
    preferred_source_formats: [graphviz, mermaid]
    allowed_source_formats: [graphviz, mermaid]
    preferred_layout_patterns: [data-pipeline, data-hub]
    allowed_layout_patterns: [data-pipeline, data-hub, control-sidecar-flow]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: data
    allowed_viewpoint_families: [data]
    preferred_notation_profiles: [data-movement]
    allowed_notation_profiles: [data-movement]
  deployment:
    pick_when:
      - Environments, zones, hosts, containers, networks, or trust boundaries are explicit.
      - Physical or runtime placement is the primary reading task.
    skip_when:
      - The source only defines logical services or package dependencies.
      - Placement would require inventing infrastructure not present in the source.
    alternatives:
      - Use architecture for logical runtime structure and component for package dependencies.
    preferred_source_formats: [plantuml, graphviz]
    allowed_source_formats: [plantuml, graphviz]
    preferred_layout_patterns: [deployment-zones]
    allowed_layout_patterns: [deployment-zones, layered-system]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes]
    visual_identity: strict
    preferred_viewpoint_family: structure
    allowed_viewpoint_families: [structure]
    preferred_notation_profiles: [deployment-topology]
    allowed_notation_profiles: [deployment-topology]
  er:
    pick_when:
      - Entities, fields, keys, and relationship cardinalities are explicit.
      - Data structure and integrity constraints are the primary reading task.
    skip_when:
      - Fields, primary keys, or cardinalities are missing.
      - The source describes data movement rather than persisted relationships.
    alternatives:
      - Use data-flow for movement and mark needs_clarification when schema facts are missing.
    preferred_source_formats: [mermaid, plantuml]
    allowed_source_formats: [mermaid, plantuml]
    preferred_layout_patterns: [er-domain-grid]
    allowed_layout_patterns: [er-domain-grid]
    minimum_enhancement: light
    required_sections: [entities, relationships]
    non_empty_sections: [entities, relationships]
    visual_identity: strict
    preferred_viewpoint_family: data
    allowed_viewpoint_families: [data]
    preferred_notation_profiles: [er-schema]
    allowed_notation_profiles: [er-schema]
  event-flow:
    pick_when:
      - Producers, named events, topics, subscribers, or projections are explicit.
      - Facts emitted after state changes and asynchronous reactions are primary.
    skip_when:
      - The source describes payload transformation or synchronous request chronology instead.
      - Event names or subscribers would need to be inferred.
    alternatives:
      - Use data-flow for transformation pipelines and sequence for ordered interactions.
    preferred_source_formats: [mermaid, graphviz]
    allowed_source_formats: [mermaid, graphviz]
    preferred_layout_patterns: [event-bus]
    allowed_layout_patterns: [event-bus, control-sidecar-flow]
    minimum_enhancement: strong
    required_sections: [nodes, edges, groups]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: interaction
    allowed_viewpoint_families: [interaction, data]
    preferred_notation_profiles: [event-stream]
    allowed_notation_profiles: [event-stream]
  flow:
    pick_when:
      - Ordered steps, decisions, approvals, retries, or exception paths are explicit.
      - The reading task is how work progresses rather than who exchanges messages over time.
    skip_when:
      - Multiple stable participants and chronological messages are the primary semantics.
      - Lifecycle states matter independently of the procedure that reaches them.
    alternatives:
      - Use sequence for participant chronology, swimlane for ownership handoffs, and state for lifecycle topology.
    preferred_source_formats: [mermaid]
    allowed_source_formats: [mermaid, graphviz]
    preferred_layout_patterns: [linear-flow, branching-flow, control-sidecar-flow]
    allowed_layout_patterns: [linear-flow, branching-flow, control-sidecar-flow, swimlane-flow, value-stream, loop-mechanism]
    minimum_enhancement: medium
    required_sections: [nodes, edges]
    non_empty_sections: [nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: behavior
    allowed_viewpoint_families: [behavior, decision]
    preferred_notation_profiles: [activity-flow]
    allowed_notation_profiles: [activity-flow]
  sequence:
    pick_when:
      - Stable participants exchange explicitly ordered calls, messages, events, or responses.
      - Message order, sync/async behavior, or activation is the primary reading task.
    skip_when:
      - The source only provides process steps without stable message participants.
      - Structural dependencies or data transformation stages are more important than chronology.
    alternatives:
      - Use flow for procedures, architecture for structure, and data-flow for transformation.
    preferred_source_formats: [plantuml, mermaid]
    allowed_source_formats: [plantuml, mermaid]
    preferred_layout_patterns: [sequence-lifelines]
    allowed_layout_patterns: [sequence-lifelines]
    minimum_enhancement: light
    required_sections: [participants, messages]
    non_empty_sections: [participants, messages]
    visual_identity: strict
    preferred_viewpoint_family: interaction
    allowed_viewpoint_families: [interaction]
    preferred_notation_profiles: [sequence-interaction]
    allowed_notation_profiles: [sequence-interaction]
  state:
    pick_when:
      - Named lifecycle states and permitted transitions are explicit.
      - State topology, guards, or terminal conditions are primary.
    skip_when:
      - The source only lists procedural steps or status labels without transitions.
      - Participant message order is the primary story.
    alternatives:
      - Use flow for procedures and sequence for participant interactions.
    preferred_source_formats: [mermaid]
    allowed_source_formats: [mermaid, plantuml]
    preferred_layout_patterns: [state-transition]
    allowed_layout_patterns: [state-transition, branching-flow]
    minimum_enhancement: light
    required_sections: [states, transitions]
    non_empty_sections: [states, transitions]
    visual_identity: strict
    preferred_viewpoint_family: state
    allowed_viewpoint_families: [state]
    preferred_notation_profiles: [state-machine]
    allowed_notation_profiles: [state-machine]
  swimlane:
    pick_when:
      - Activities have explicit owners and cross-role or cross-system handoffs matter.
      - Responsibility boundaries are as important as process order.
    skip_when:
      - Ownership is absent, inferred, or irrelevant to understanding the process.
      - Ordered messages between technical participants are better expressed chronologically.
    alternatives:
      - Use flow when ownership is secondary and sequence when messages are primary.
    preferred_source_formats: [plantuml]
    allowed_source_formats: [plantuml, graphviz]
    preferred_layout_patterns: [swimlane-flow]
    allowed_layout_patterns: [swimlane-flow]
    minimum_enhancement: medium
    required_sections: [lanes, nodes, edges]
    non_empty_sections: [lanes, nodes, edges]
    visual_identity: strict
    preferred_viewpoint_family: ownership
    allowed_viewpoint_families: [ownership]
    preferred_notation_profiles: [swimlane-activity]
    allowed_notation_profiles: [swimlane-activity]
