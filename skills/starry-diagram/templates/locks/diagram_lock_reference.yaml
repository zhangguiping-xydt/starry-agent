id: architecture-overview
title: 架构总览
type: architecture
source_format: graphviz
visual_style:
  style_id: clean-technical
  enhancement_level: strong
layout_plan:
  pattern: layered-system
  selection_reason: 源材料明确给出应用入口与编排服务的分层依赖，且不存在以消息时序为主的阅读任务。
  direction: left-to-right
  density: balanced
  view_role: standalone
  primary_items:
    - frontend-chat-entry
    - workflow-orchestration-service
  regions: []
  edge_roles:
    primary:
      - frontend-to-workflow
    secondary: []
    control: []
canvas:
  mode: fixed
  width: 1280
  height: 720
  viewBox: "0 0 1280 720"
delivery_target:
  width_px: 1200
  height_px: 675
  fit: contain
  min_effective_font_px: 12
  min_contrast_ratio: 4.5
  min_text_padding_px: 6
  max_edge_label_distance_px: 28
  max_unmeasurable_text_fraction: 0
raster_delivery:
  format: png
  pixel_ratio: 2
nodes:
  - id: frontend-chat-entry
    label: 前端对话入口
    kind: ui
    required: true
  - id: workflow-orchestration-service
    label: 工作流编排服务
    kind: service
    required: true
edges:
  - id: frontend-to-workflow
    from: frontend-chat-entry
    to: workflow-orchestration-service
    label: 提交对话任务
    required: true
groups:
  - id: application-runtime
    label: 应用运行时
    members:
      - frontend-chat-entry
      - workflow-orchestration-service
style_tokens:
  colors:
    background: "#f8fafc"
    surface: "#ffffff"
    primary: "#2563eb"
    accent: "#14b8a6"
    text: "#0f172a"
    muted: "#64748b"
    line: "#94a3b8"
  typography:
    font_family: "Noto Sans CJK SC"
    diagram_title_size: 28
    group_title_size: 18
    node_title_size: 16
    node_body_size: 14
    edge_label_size: 14
    annotation_size: 13
    min_font_size: 12
  geometry:
    node_padding_x: 24
    node_padding_y: 16
    cluster_padding: 28
    node_gap: 40
    rank_gap: 68
    corner_radius: 8
  connectors:
    width: 1.6
    arrow_size: 7
    routing: orthogonal
